name: Android CI and release
run-name: Android CI and release
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          architecture: x64
      - run: flutter pub get
      - name: Analyze Dart sources
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter regression tests
        run: flutter test --no-pub
      - name: Install native curl test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
      - name: Run native curl regression tests
        run: sh test/native_curl/run.sh
      - name: Prepare optional Android signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "No custom signing key configured; using the default Android signing configuration."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_BASE64:?Existing release keystore secret is required}"
          : "${ANDROID_STORE_PASSWORD:?Existing store password secret is required}"
          : "${ANDROID_KEY_ALIAS:?Existing key alias secret is required}"
          : "${ANDROID_KEY_PASSWORD:?Existing key password secret is required}"
          keystore="$RUNNER_TEMP/pica-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Build Android APKs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            (cd android && ./gradlew assembleRelease)
          else
            (cd android && ./gradlew assembleDebug)
          fi
      - name: Verify release APK signer certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$ANDROID_CERT_SHA256"
          if [[ -z "$expected" ]]; then
            echo "No expected signing certificate configured; skipping certificate comparison."
            exit 0
          fi
          expected="$(printf '%s' "$expected" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ "$expected" =~ ^[A-F0-9]{64}$ ]]
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          found=0
          while IFS= read -r apk; do
            found=1
            actual="$("$apksigner" verify --print-certs "$apk" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' |
              tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test -n "$actual"
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected signing certificate in $apk" >&2
              exit 1
            fi
          done < <(find build/app/outputs/apk/release -type f -name '*.apk' | sort)
          test "$found" -eq 1
      - name: Prepare APK files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          mkdir -p release
          find build/app/outputs/apk -type f -name "*.apk" -print

          while IFS= read -r apk; do
            name="$(basename "$apk")"
            case "$name" in
              *armeabi-v7a*)
                cp "$apk" "release/PicaComic-${version}-armeabi-v7a.apk"
                ;;
              *arm64-v8a*)
                cp "$apk" "release/PicaComic-${version}-arm64-v8a.apk"
                ;;
              *x86_64*)
                cp "$apk" "release/PicaComic-${version}-x86_64.apk"
                ;;
              *.apk)
                cp "$apk" "release/PicaComic-${version}.apk"
                ;;
            esac
          done < <(find build/app/outputs/apk -type f -name "*.apk")

          for apk in \
            "release/PicaComic-${version}-armeabi-v7a.apk" \
            "release/PicaComic-${version}-arm64-v8a.apk" \
            "release/PicaComic-${version}-x86_64.apk" \
            "release/PicaComic-${version}.apk"; do
            test -f "$apk"
          done
          sha256sum release/PicaComic-*.apk > release/SHA256SUMS
          ls -lh release
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: PicaComic-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/app/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: PicaComic-${{ github.ref_name }}-android
          path: |
            release/PicaComic-*.apk
            release/SHA256SUMS
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: PicaComic-${{ github.ref_name }}-android
          path: release
      - name: Upload APKs to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          remote_tag="$(git ls-remote origin "refs/tags/${tag}" "refs/tags/${tag}^{}" |
            awk -v ref="refs/tags/${tag}" '$2 == ref { commit = $1 } $2 == ref "^{}" { commit = $1 } END { print commit }')"
          if [[ "$remote_tag" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag no longer points to the commit that produced these APKs." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite immutable assets." >&2
            exit 1
          fi
          gh release create "$tag" release/*.apk release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Automated Android release build."
